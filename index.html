<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PE Track Timer - Bib Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Using Tesseract.js for OCR (Optical Character Recognition) to read bib numbers -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        #video-feed {
            width: 100%;
            height: auto;
            transform: scaleX(1); /* No mirroring for OCR */
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 40%;
            border: 2px solid #ef4444;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #ef4444;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">🏃‍♂️ TRACK TIMER</h1>
            <div id="master-clock" class="text-2xl font-mono font-bold">00:00.00</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- Setup Phase -->
        <section id="setup-section" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4">1. Setup Student List</h2>
            <p class="text-sm text-slate-500 mb-4">Upload a CSV with 'Bib' and 'Name' columns, or use the default list below.</p>
            <input type="file" id="csv-upload" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4">
            
            <div class="flex gap-2">
                <button id="start-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95">
                    START RACE
                </button>
            </div>
        </section>

        <!-- Active Timing Phase -->
        <section id="timing-section" class="hidden space-y-4">
            <div class="video-container shadow-2xl">
                <video id="video-feed" autoplay playsinline muted></video>
                <div class="scan-overlay">
                    <div class="scan-line"></div>
                </div>
                <div id="scan-status" class="absolute bottom-4 left-0 right-0 text-center text-white text-xs bg-black/50 py-1">
                    Align Bib Number in Red Box
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="capture-manual" class="bg-blue-600 text-white p-4 rounded-xl font-bold shadow-md active:bg-blue-800">
                    📸 CAPTURE BIB
                </button>
                <button id="stop-race" class="bg-slate-200 text-slate-700 p-4 rounded-xl font-bold shadow-md">
                    END RACE
                </button>
            </div>

            <!-- Manual Entry Fallback -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 flex gap-2">
                <input type="number" id="manual-bib" placeholder="Manual Bib No." class="flex-1 border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <button id="manual-submit" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">LOG</button>
            </div>
        </section>

        <!-- Results Table -->
        <section id="results-section" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold">Captured Times</h2>
                <button id="export-btn" class="text-blue-600 text-sm font-bold">EXPORT CSV</button>
            </div>
            <div class="overflow-x-auto">
                <table id="results-table" class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase">
                            <th class="p-3">Bib</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Time</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Result rows will appear here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <canvas id="canvas-capture" style="display:none;"></canvas>

    <script>
        // --- DATA & STATE ---
        let students = [
            { bib: "101", name: "Student A" },
            { bib: "102", name: "Student B" },
            { bib: "103", name: "Student C" },
            { bib: "104", name: "Student D" },
            { bib: "105", name: "Student E" }
        ];
        let recordedResults = [];
        let startTime = null;
        let timerInterval = null;
        let isProcessing = false;

        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('canvas-capture');
        const ctx = canvas.getContext('2d');
        const masterClock = document.getElementById('master-clock');
        const statusEl = document.getElementById('scan-status');

        // --- CORE FUNCTIONS ---

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access denied. Please allow camera to scan bibs.");
            }
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                masterClock.textContent = formatTime(elapsed);
            }, 50);
        }

        function logTime(bibNo) {
            const cleanBib = bibNo.toString().trim();
            const student = students.find(s => s.bib === cleanBib);
            const currentTime = masterClock.textContent;

            // Check if already recorded
            if (recordedResults.find(r => r.bib === cleanBib)) {
                showMessage(`Bib ${cleanBib} already recorded.`);
                return;
            }

            const record = {
                bib: cleanBib,
                name: student ? student.name : "Unknown",
                time: currentTime
            };

            recordedResults.unshift(record); // Add to start of array
            updateTable();
            showMessage(`Logged Bib ${cleanBib}: ${currentTime}`, "success");
        }

        function updateTable() {
            const body = document.getElementById('results-body');
            body.innerHTML = recordedResults.map(r => `
                <tr class="border-t border-slate-100 animate-in fade-in slide-in-from-top-2 duration-300">
                    <td class="p-3 font-bold">${r.bib}</td>
                    <td class="p-3 text-slate-600 text-sm">${r.name}</td>
                    <td class="p-3 font-mono text-blue-700">${r.time}</td>
                </tr>
            `).join('');
        }

        function showMessage(msg, type = "info") {
            statusEl.textContent = msg;
            statusEl.className = `absolute bottom-4 left-0 right-0 text-center text-white text-xs py-1 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            setTimeout(() => {
                statusEl.textContent = "Align Bib Number in Red Box";
                statusEl.className = "absolute bottom-4 left-0 right-0 text-center text-white text-xs bg-black/50 py-1";
            }, 3000);
        }

        // --- OCR LOGIC ---

        async function captureAndScan() {
            if (isProcessing) return;
            isProcessing = true;
            statusEl.textContent = "Processing Bib...";

            // Draw current video frame to canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Focus on the center area (the red box area)
            const cropX = canvas.width * 0.2;
            const cropY = canvas.height * 0.3;
            const cropW = canvas.width * 0.6;
            const cropH = canvas.height * 0.4;

            ctx.drawImage(video, 0, 0);
            
            // Run Tesseract OCR
            try {
                const result = await Tesseract.recognize(
                    canvas,
                    'eng',
                    { logger: m => console.log(m.status) }
                );

                // Look for numbers in the text
                const text = result.data.text;
                const matches = text.match(/\b\d{2,4}\b/g); // Find 2-4 digit numbers

                if (matches && matches.length > 0) {
                    logTime(matches[0]);
                } else {
                    showMessage("No bib number detected. Try manual entry.");
                }
            } catch (err) {
                console.error(err);
                showMessage("OCR Error.");
            } finally {
                isProcessing = false;
            }
        }

        // --- EVENT LISTENERS ---

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('timing-section').classList.remove('hidden');
            initCamera();
            startTimer();
        });

        document.getElementById('capture-manual').addEventListener('click', captureAndScan);

        document.getElementById('manual-submit').addEventListener('click', () => {
            const input = document.getElementById('manual-bib');
            if (input.value) {
                logTime(input.value);
                input.value = "";
            }
        });

        document.getElementById('stop-race').addEventListener('click', () => {
            if (confirm("End the race and stop the clock?")) {
                clearInterval(timerInterval);
                const stream = video.srcObject;
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
                document.getElementById('timing-section').classList.add('hidden');
            }
        });

        document.getElementById('csv-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result;
                const rows = text.split('\n').slice(1); // skip header
                const newList = rows.map(row => {
                    const cols = row.split(',');
                    return { bib: cols[0]?.trim(), name: cols[1]?.trim() };
                }).filter(s => s.bib);
                
                if (newList.length > 0) {
                    students = newList;
                    alert(`Loaded ${students.length} students.`);
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (recordedResults.length === 0) return;
            
            let csvContent = "data:text/csv;charset=utf-8,Bib,Name,Time\n";
            recordedResults.forEach(r => {
                csvContent += `${r.bib},${r.name},${r.time}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `track_results_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
