<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Bib Tracker</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; margin: 0; background: #000; color: #fff; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* Compact Header */
        header { 
            flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
            padding: 5px 12px; background: #1a1a1a; border-bottom: 1px solid #333;
        }
        #timer { font-family: monospace; font-size: 1.5rem; color: #0f0; }
        .limit-label { font-size: 0.6rem; color: #888; text-transform: uppercase; }

        /* Camera Viewport */
        #cam-container { flex: 1; position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #status-bar { 
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.6); 
            font-size: 11px; padding: 4px; text-align: center; color: #0f0; 
        }

        /* Button Row - Fixed at bottom of camera */
        .controls { 
            flex: 0 0 auto; display: flex; gap: 5px; padding: 8px; background: #111; 
        }
        button { 
            flex: 1; padding: 12px 5px; border: none; border-radius: 4px; 
            font-weight: bold; font-size: 14px; color: white; transition: 0.2s;
        }
        #btn-start { background-color: #28a745; }
        #btn-stop { background-color: #dc3545; display: none; }
        #btn-reset { background-color: #444; }
        button:disabled { opacity: 0.3; }

        /* Results Table - Fixed Height */
        #table-container { 
            flex: 0 0 30vh; overflow-y: auto; background: #fff; 
        }
        table { width: 100%; border-collapse: collapse; color: #222; }
        th { 
            position: sticky; top: 0; background: #333; color: #fff; 
            padding: 6px; font-size: 11px; text-align: center; 
        }
        td { padding: 8px 4px; border-bottom: 1px solid #ddd; text-align: center; font-size: 14px; }
        
        .confirmed { background-color: #c8ffc8; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="limit-label">Scanning Bibs</div>
            <div style="font-size: 0.9rem; font-weight: bold;">001 - 040</div>
        </div>
        <div id="timer">00:00:00</div>
    </header>
    
    <div id="cam-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="status-bar">Initializing AI...</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="btn-start" disabled>START</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-reset">RESET</button>
    </div>

    <div id="table-container">
        <table>
            <thead>
                <tr>
                    <th width="33%">BIB #</th>
                    <th width="33%">LAP</th>
                    <th width="34%">TIME</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>

<script>
    let isRacing = false, worker = null, startTime = 0, timerInterval, runnerData = {};
    let candidates = {}; 
    const REQUIRED_CONFIRMATIONS = 3; // Seeing the number 3 times before logging
    const LAP_COOLDOWN = 15000; 

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultsBody = document.getElementById('results-body');
    const statusBar = document.getElementById('status-bar');

    async function initOCR() {
        worker = Tesseract.createWorker();
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        await worker.setParameters({ 
            tessedit_char_whitelist: '0123456789',
            tessedit_pageseg_mode: '11' 
        });
        document.getElementById('btn-start').disabled = false;
        statusBar.innerText = "System Ready";
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 } } 
            });
            video.srcObject = stream;
        } catch(e) { statusBar.innerText = "Camera Error"; }
    }

    async function scanLoop() {
        if (!isRacing) return;

        canvas.width = 500; // Optimal balance for speed/accuracy
        canvas.height = (video.videoHeight / video.videoWidth) * 500;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const { data: { text, confidence } } = await worker.recognize(canvas);
        const found = text.match(/\b\d{1,3}\b/g);

        if (found && confidence > 45) {
            found.forEach(numStr => {
                const val = parseInt(numStr);
                if (val >= 1 && val <= 40) validateBib(val.toString().padStart(3, '0'));
            });
        }
        requestAnimationFrame(scanLoop);
    }

    function validateBib(bib) {
        if (runnerData[bib] && (Date.now() - runnerData[bib].lastSeen < LAP_COOLDOWN)) return;

        candidates[bib] = (candidates[bib] || 0) + 1;
        statusBar.innerText = `Validating Bib ${bib}...`;

        if (candidates[bib] >= REQUIRED_CONFIRMATIONS) {
            logBib(bib);
            delete candidates[bib]; 
        }
    }

    function logBib(bib) {
        const now = Date.now();
        if (!runnerData[bib]) runnerData[bib] = { laps: 0, lastSeen: 0 };
        
        runnerData[bib].laps++;
        runnerData[bib].lastSeen = now;
        
        const row = document.createElement('tr');
        row.className = 'confirmed';
        row.innerHTML = `<td>${bib}</td><td>${runnerData[bib].laps}</td><td>${document.getElementById('timer').innerText}</td>`;
        resultsBody.prepend(row);
        statusBar.innerText = `LOGGED: BIB ${bib}`;
        setTimeout(() => { if(isRacing) statusBar.innerText = "Scanning..."; }, 2000);
    }

    function updateTimer() {
        const diff = Date.now() - startTime;
        document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
    }

    document.getElementById('btn-start').addEventListener('click', () => {
        isRacing = true;
        startTime = startTime === 0 ? Date.now() : Date.now() - (Date.now() - startTime);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        scanLoop();
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
        isRacing = false;
        clearInterval(timerInterval);
        document.getElementById('btn-start').style.display = 'block';
        document.getElementById('btn-stop').style.display = 'none';
        statusBar.innerText = "Paused";
    });

    document.getElementById('btn-reset').addEventListener('click', () => { 
        if(confirm("Wipe all data?")) location.reload(); 
    });

    startCamera();
    initOCR();
</script>
</body>
</html>
