<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bib Tracker 001-040</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        /* --- Layout: One Page, No Page Scroll --- */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; 
            background: #222; color: #fff;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; /* Prevents full page scrolling */
        }

        /* Top Bar: Title & Timer */
        header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #333; border-bottom: 1px solid #444;
        }
        h2 { margin: 0; font-size: 1.2rem; color: #aaa; }
        #timer { font-family: monospace; font-size: 1.5rem; font-weight: bold; color: #0f0; }

        /* Camera Section */
        #cam-container { 
            flex: 0 0 45vh; /* Takes up 45% of screen height */
            position: relative; background: #000; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Green Scan Box Overlay */
        #scan-region {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; height: 25%; 
            border: 2px solid #00ff00; border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        #status-overlay {
            position: absolute; bottom: 10px; left: 0; right: 0;
            text-align: center; font-size: 12px; color: rgba(255,255,255,0.7);
            text-shadow: 1px 1px 2px #000;
        }

        /* Controls Bar */
        .controls { 
            flex: 0 0 auto; padding: 10px; 
            display: flex; gap: 10px; background: #222;
        }
        button { 
            flex: 1; padding: 12px; border: none; border-radius: 6px; 
            font-size: 16px; font-weight: bold; color: white; cursor: pointer;
        }
        #btn-start { background-color: #28a745; }
        #btn-stop { background-color: #dc3545; display: none; }
        #btn-reset { background-color: #6c757d; }
        button:disabled { opacity: 0.3; }

        /* Scrollable Results Table */
        #table-container {
            flex: 1 1 auto; /* Takes remaining space */
            overflow-y: auto; /* Allows scrolling INSIDE this div */
            background: #fff;
        }
        table { width: 100%; border-collapse: collapse; color: #333; }
        th { 
            position: sticky; top: 0; background: #007bff; color: white; 
            padding: 10px; z-index: 2; font-size: 14px;
        }
        td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; font-size: 14px; }
        .new-entry { background-color: #e8f5e9; animation: flash 1s; }
        
        @keyframes flash { 0% { background: #66ff66; } 100% { background: #e8f5e9; } }
    </style>
</head>
<body>

    <header>
        <h2>RaceTrack</h2>
        <div id="timer">00:00:00</div>
    </header>
    
    <div id="cam-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="scan-region"></div>
        <div id="status-overlay">Initializing OCR...</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="btn-start" disabled>START</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-reset">RESET</button>
    </div>

    <div id="table-container">
        <table>
            <thead>
                <tr>
                    <th>Bib (001-040)</th>
                    <th>Lap</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="results-body">
                </tbody>
        </table>
    </div>

<script>
    // --- Config ---
    const MIN_BIB = 1;
    const MAX_BIB = 40;
    const SCAN_INTERVAL_MS = 800; 
    const LAP_COOLDOWN_SEC = 20;   
    const MIN_CONFIDENCE = 70;

    // --- Variables ---
    let stream, timerInterval, scanInterval, startTime = 0, isRacing = false, worker = null;
    let runnerData = {}; 

    // --- Elements ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timerDisplay = document.getElementById('timer');
    const statusOverlay = document.getElementById('status-overlay');
    const resultsBody = document.getElementById('results-body');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const btnReset = document.getElementById('btn-reset');

    // --- 1. Init OCR (Robust Loading for GitHub) ---
    async function initOCR() {
        statusOverlay.innerText = "Loading AI Model...";
        worker = Tesseract.createWorker({
            workerPath: 'https://unpkg.com/tesseract.js@v2.1.0/dist/worker.min.js',
            langPath: 'https://tessdata.projectnaptha.com/4.0.0',
            corePath: 'https://unpkg.com/tesseract.js-core@v2.1.0/tesseract-core.wasm.js'
        });
        
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        await worker.setParameters({ tessedit_char_whitelist: '0123456789' });
        
        statusOverlay.innerText = "Ready. Press START.";
        btnStart.disabled = false;
    }

    // --- 2. Camera ---
    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            video.srcObject = stream;
        } catch (e) { alert("Camera Error: " + e.message); }
    }

    // --- 3. Timer ---
    function updateTimer() {
        const diff = Date.now() - startTime;
        const iso = new Date(diff).toISOString().substr(11, 8);
        timerDisplay.innerText = iso;
    }

    // --- 4. Scanning Logic ---
    async function scanFrame() {
        if (!isRacing) return;

        // Crop center of video for speed
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        // Scan roughly center 50%
        ctx.drawImage(video, canvas.width*0.25, canvas.height*0.35, canvas.width*0.5, canvas.height*0.3, 0, 0, canvas.width, canvas.height);

        const { data: { text, confidence } } = await worker.recognize(canvas);
        const rawNum = parseInt(text.trim());

        // FILTER: Check Range 1 - 40
        if (confidence > MIN_CONFIDENCE && !isNaN(rawNum)) {
            if (rawNum >= MIN_BIB && rawNum <= MAX_BIB) {
                // Format as 001, 002...
                const formattedBib = rawNum.toString().padStart(3, '0');
                processBib(formattedBib);
                statusOverlay.innerText = `Detected: ${formattedBib}`;
            } else {
                statusOverlay.innerText = `Ignored: ${rawNum} (Out of range)`;
            }
        }
    }

    function processBib(bib) {
        const now = Date.now();
        if (!runnerData[bib]) runnerData[bib] = { laps: 0, lastSeen: 0 };

        if (now - runnerData[bib].lastSeen > (LAP_COOLDOWN_SEC * 1000)) {
            runnerData[bib].laps++;
            runnerData[bib].lastSeen = now;
            
            const row = document.createElement('tr');
            row.classList.add('new-entry');
            row.innerHTML = `<td><strong>${bib}</strong></td><td>${runnerData[bib].laps}</td><td>${timerDisplay.innerText}</td>`;
            resultsBody.prepend(row);
        }
    }

    // --- 5. Controls ---
    btnStart.addEventListener('click', () => {
        isRacing = true;
        startTime = Date.now() - (startTime > 0 ? (Date.now() - startTime) : 0);
        timerInterval = setInterval(updateTimer, 100);
        scanInterval = setInterval(scanFrame, SCAN_INTERVAL_MS);
        btnStart.style.display = 'none';
        btnStop.style.display = 'block';
        statusOverlay.innerText = "Scanning 001-040...";
    });

    btnStop.addEventListener('click', () => {
        isRacing = false;
        clearInterval(timerInterval);
        clearInterval(scanInterval);
        btnStart.style.display = 'block';
        btnStart.innerText = "RESUME";
        btnStop.style.display = 'none';
        statusOverlay.innerText = "Paused";
    });

    btnReset.addEventListener('click', () => {
        if(confirm("Reset race?")) {
            location.reload(); 
        }
    });

    startCamera();
    initOCR();
</script>
</body>
</html>
