<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Scan Bib Tracker</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background: #111; color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
            padding: 8px 15px; background: #222; border-bottom: 2px solid #007bff;
        }
        #timer { font-family: monospace; font-size: 1.8rem; font-weight: bold; color: #0f0; }

        #cam-container { 
            flex: 0 0 45vh; position: relative; background: #000; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Full-width scan area for multiple runners */
        #scan-region {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 95%; height: 60%; 
            border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 10px;
        }
        .flash { animation: pulse 0.3s; }
        @keyframes pulse { 0% { background: rgba(0,255,0,0.3); } 100% { background: transparent; } }

        #status-overlay {
            position: absolute; top: 5px; left: 5px; font-size: 10px; color: #0f0; background: rgba(0,0,0,0.6); padding: 2px 5px;
        }

        .controls { flex: 0 0 auto; padding: 10px; display: flex; gap: 8px; background: #111; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        #btn-start { background-color: #28a745; }
        #btn-stop { background-color: #dc3545; display: none; }
        #btn-reset { background-color: #444; }

        #table-container { flex: 1 1 auto; overflow-y: auto; background: #eee; }
        table { width: 100%; border-collapse: collapse; color: #222; }
        th { position: sticky; top: 0; background: #333; color: white; padding: 10px; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #ccc; text-align: center; font-size: 16px; }
        tr.new-entry { background-color: #afffa0; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 0.8rem;">MULTI-SCAN</div>
        <div id="timer">00:00:00</div>
    </header>
    
    <div id="cam-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="scan-region"></div>
        <div id="status-overlay">AI Offline</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="btn-start" disabled>START</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-reset">RESET</button>
    </div>

    <div id="table-container">
        <table>
            <thead>
                <tr>
                    <th>BIB</th>
                    <th>LAP</th>
                    <th>TIME</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>

<script>
    const MIN_BIB = 1, MAX_BIB = 40;
    const LAP_COOLDOWN_SEC = 10;   
    let isRacing = false, worker = null, startTime = 0, timerInterval, runnerData = {};

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status-overlay');
    const resultsBody = document.getElementById('results-body');

    async function initOCR() {
        status.innerText = "Loading AI...";
        worker = Tesseract.createWorker();
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        await worker.setParameters({ 
            tessedit_char_whitelist: '0123456789 ', // Allowed spaces for multi-read
            tessedit_pageseg_mode: '6' // Assume a single uniform block of text for faster speed
        });
        status.innerText = "AI ONLINE";
        document.getElementById('btn-start').disabled = false;
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", width: 1280, height: 720 } 
        });
        video.srcObject = stream;
    }

    function updateTimer() {
        const diff = Date.now() - startTime;
        document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
    }

    // --- RECURSIVE FAST SCAN ---
    async function quickScan() {
        if (!isRacing) return;

        // Capture large area
        canvas.width = 400; // Small canvas = much faster OCR
        canvas.height = 300;
        ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, 0, 0, canvas.width, canvas.height);

        const { data: { text } } = await worker.recognize(canvas);
        
        // Use Regex to find ALL numbers in the string
        const detectedNumbers = text.match(/\b\d+\b/g);

        if (detectedNumbers) {
            detectedNumbers.forEach(numStr => {
                const val = parseInt(numStr);
                if (val >= MIN_BIB && val <= MAX_BIB) {
                    recordBib(val.toString().padStart(3, '0'));
                }
            });
        }

        // Start next scan immediately without waiting for a fixed interval
        requestAnimationFrame(quickScan);
    }

    function recordBib(bib) {
        const now = Date.now();
        if (!runnerData[bib]) runnerData[bib] = { laps: 0, lastSeen: 0 };

        if (now - runnerData[bib].lastSeen > (LAP_COOLDOWN_SEC * 1000)) {
            runnerData[bib].laps++;
            runnerData[bib].lastSeen = now;
            
            // Visual feedback
            document.getElementById('scan-region').classList.add('flash');
            setTimeout(() => document.getElementById('scan-region').classList.remove('flash'), 300);

            const row = document.createElement('tr');
            row.className = 'new-entry';
            row.innerHTML = `<td>${bib}</td><td>${runnerData[bib].laps}</td><td>${document.getElementById('timer').innerText}</td>`;
            resultsBody.prepend(row);
        }
    }

    document.getElementById('btn-start').addEventListener('click', () => {
        isRacing = true;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        quickScan();
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
        isRacing = false;
        clearInterval(timerInterval);
        document.getElementById('btn-start').style.display = 'block';
        document.getElementById('btn-stop').style.display = 'none';
    });

    document.getElementById('btn-reset').addEventListener('click', () => { if(confirm("Reset?")) location.reload(); });

    startCamera();
    initOCR();
</script>
</body>
</html>
