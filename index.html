<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bib Tracker 001-040</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background: #1a1a1a; color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #222; border-bottom: 2px solid #333;
        }
        h2 { margin: 0; font-size: 1rem; color: #007bff; text-transform: uppercase; letter-spacing: 1px; }
        #timer { font-family: 'Courier New', monospace; font-size: 1.6rem; font-weight: bold; color: #0f0; }

        /* Camera Section - Adjusted for larger scan area */
        #cam-container { 
            flex: 0 0 50vh; position: relative; background: #000; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Expanded Scan Box Overlay */
        #scan-region {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 50%; /* INCREASED RADIUS: Was 70x25, now 85x50 */
            border: 3px solid rgba(0, 255, 0, 0.4); border-radius: 12px;
            transition: all 0.2s ease;
        }
        .success-flash { border-color: #00ff00 !important; box-shadow: 0 0 30px #00ff00; background: rgba(0,255,0,0.1); }

        #status-overlay {
            position: absolute; bottom: 10px; left: 0; right: 0;
            text-align: center; font-size: 13px; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 0;
        }

        .controls { flex: 0 0 auto; padding: 10px; display: flex; gap: 8px; background: #1a1a1a; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; }
        #btn-start { background-color: #28a745; }
        #btn-stop { background-color: #dc3545; display: none; }
        #btn-reset { background-color: #444; }
        button:disabled { opacity: 0.2; }

        #table-container { flex: 1 1 auto; overflow-y: auto; background: #fdfdfd; }
        table { width: 100%; border-collapse: collapse; color: #222; }
        th { position: sticky; top: 0; background: #007bff; color: white; padding: 12px; font-size: 13px; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 15px; }
        .new-entry { background-color: #d4edda; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h2>Bib Scanner</h2>
        <div id="timer">00:00:00</div>
    </header>
    
    <div id="cam-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="scan-region"></div>
        <div id="status-overlay">Waking up AI...</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="btn-start" disabled>START RACE</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-reset">RESET</button>
    </div>

    <div id="table-container">
        <table>
            <thead>
                <tr>
                    <th>BIB #</th>
                    <th>LAP</th>
                    <th>TIME</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>

<script>
    const MIN_BIB = 1;
    const MAX_BIB = 40;
    const SCAN_INTERVAL_MS = 600; // Faster scanning (0.6s)
    const LAP_COOLDOWN_SEC = 15;   
    const MIN_CONFIDENCE = 65;    // Slightly lower confidence to catch movement better

    let stream, timerInterval, scanInterval, startTime = 0, isRacing = false, worker = null;
    let runnerData = {}; 

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timerDisplay = document.getElementById('timer');
    const statusOverlay = document.getElementById('status-overlay');
    const scanRegion = document.getElementById('scan-region');
    const resultsBody = document.getElementById('results-body');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');

    async function initOCR() {
        statusOverlay.innerText = "Initializing Engine...";
        worker = Tesseract.createWorker({
            workerPath: 'https://unpkg.com/tesseract.js@v2.1.0/dist/worker.min.js',
            langPath: 'https://tessdata.projectnaptha.com/4.0.0',
            corePath: 'https://unpkg.com/tesseract.js-core@v2.1.0/tesseract-core.wasm.js'
        });
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        await worker.setParameters({ tessedit_char_whitelist: '0123456789' });
        statusOverlay.innerText = "System Ready";
        btnStart.disabled = false;
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
        } catch (e) { alert("Enable camera permissions in your browser settings."); }
    }

    function updateTimer() {
        const diff = Date.now() - startTime;
        timerDisplay.innerText = new Date(diff).toISOString().substr(11, 8);
    }

    async function scanFrame() {
        if (!isRacing) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // CROP AREA: We take a large center-cut of the video to process
        // This coordinates with the visual green box (85% width, 50% height)
        const cW = canvas.width * 0.85;
        const cH = canvas.height * 0.50;
        const cX = (canvas.width - cW) / 2;
        const cY = (canvas.height - cH) / 2;

        ctx.drawImage(video, cX, cY, cW, cH, 0, 0, canvas.width, canvas.height);

        const { data: { text, confidence } } = await worker.recognize(canvas);
        const rawNum = parseInt(text.trim());

        if (confidence > MIN_CONFIDENCE && !isNaN(rawNum) && rawNum >= MIN_BIB && rawNum <= MAX_BIB) {
            const formattedBib = rawNum.toString().padStart(3, '0');
            if (processBib(formattedBib)) {
                // Flash the box green on success
                scanRegion.classList.add('success-flash');
                setTimeout(() => scanRegion.classList.remove('success-flash'), 500);
            }
        }
    }

    function processBib(bib) {
        const now = Date.now();
        if (!runnerData[bib]) runnerData[bib] = { laps: 0, lastSeen: 0 };

        if (now - runnerData[bib].lastSeen > (LAP_COOLDOWN_SEC * 1000)) {
            runnerData[bib].laps++;
            runnerData[bib].lastSeen = now;
            const row = document.createElement('tr');
            row.classList.add('new-entry');
            row.innerHTML = `<td><strong>${bib}</strong></td><td>${runnerData[bib].laps}</td><td>${timerDisplay.innerText}</td>`;
            resultsBody.prepend(row);
            return true;
        }
        return false;
    }

    btnStart.addEventListener('click', () => {
        isRacing = true;
        startTime = startTime === 0 ? Date.now() : Date.now() - (Date.now() - startTime);
        timerInterval = setInterval(updateTimer, 100);
        scanInterval = setInterval(scanFrame, SCAN_INTERVAL_MS);
        btnStart.style.display = 'none';
        btnStop.style.display = 'block';
        statusOverlay.innerText = "SCANNING 001-040";
    });

    btnStop.addEventListener('click', () => {
        isRacing = false;
        clearInterval(timerInterval);
        clearInterval(scanInterval);
        btnStart.style.display = 'block';
        btnStart.innerText = "RESUME";
        btnStop.style.display = 'none';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        if(confirm("Clear all data?")) location.reload();
    });

    startCamera();
    initOCR();
</script>
</body>
</html>
